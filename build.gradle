plugins {
    id 'java'
    id 'application'
}

group = 'com.legends'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // kan ook 17 als je dat liever hebt
    }
}

ext {
    lwjglVersion = "3.3.4"
    jomlVersion  = "1.10.5"
}

application {
    mainClass = "com.legends.Main"
}

// Kies natives per OS
def os = System.getProperty("os.name").toLowerCase()
def arch = System.getProperty("os.arch").toLowerCase()

def lwjglNatives = (os.contains("win"))
        ? (arch.contains("aarch64") || arch.contains("arm64") ? "natives-windows-arm64" : "natives-windows")
        : (os.contains("mac"))
        ? (arch.contains("aarch64") || arch.contains("arm64") ? "natives-macos-arm64" : "natives-macos")
        : "natives-linux"

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"

    implementation "org.joml:joml:$jomlVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.run {
    workingDir = projectDir // zodat je relatief naar /assets kunt laden
}